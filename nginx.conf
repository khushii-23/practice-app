server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri $uri/ /index.html;
  }

  # Proxy API calls to the backend container (docker-compose service name)
  location /api/ {
    proxy_pass http://backend:5000;
  }

  location /health {
    proxy_pass http://backend:5000;
  }
}
