<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AWS Practice App</title>
  <style>
    body { font-family: system-ui, sans-serif; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { margin-bottom: 4px; }
    .status { font-size: 14px; color: #555; margin-bottom: 20px; }
    ul { list-style: none; padding: 0; }
    li { padding: 10px 12px; border: 1px solid #ddd; border-radius: 6px; margin-bottom: 8px; display: flex; justify-content: space-between; }
    .badge { font-size: 12px; background: #eef; padding: 2px 8px; border-radius: 10px; }
    form { display: flex; gap: 8px; margin-top: 16px; }
    input { flex: 1; padding: 8px; }
    button { padding: 8px 14px; cursor: pointer; }
  </style>
</head>
<body>
  <h1>AWS Practice App</h1>
  <div class="status" id="status">Checking backend...</div>

  <ul id="list"></ul>

  <form id="form">
    <input id="name" placeholder="Add a new item" required />
    <button type="submit">Add</button>
  </form>

  <script src="config.js"></script>
  <script>
    const api = (path) => `${window.API_BASE}${path}`;

    async function checkHealth() {
      const el = document.getElementById("status");
      try {
        const r = await fetch(api("/health"));
        const d = await r.json();
        el.textContent = `Backend: ${d.status} (${d.time})`;
      } catch (e) {
        el.textContent = "Backend: unreachable";
      }
    }

    async function loadItems() {
      const list = document.getElementById("list");
      list.innerHTML = "";
      try {
        const r = await fetch(api("/api/items"));
        const items = await r.json();
        items.forEach((i) => {
          const li = document.createElement("li");
          li.innerHTML = `<span>${i.name}</span><span class="badge">${i.status}</span>`;
          list.appendChild(li);
        });
      } catch (e) {
        list.innerHTML = "<li>Could not load items</li>";
      }
    }

    document.getElementById("form").addEventListener("submit", async (e) => {
      e.preventDefault();
      const input = document.getElementById("name");
      await fetch(api("/api/items"), {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ name: input.value }),
      });
      input.value = "";
      loadItems();
    });

    checkHealth();
    loadItems();
  </script>
</body>
</html>
